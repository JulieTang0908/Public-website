2><p>F0 的离散标准化分布与正态参考。标准化不会自动令分布成为正态。</p><a href="F0_standardized_vs_normal.png"><img src="F0_standardized_vs_normal.png" alt="与正态分布的比较" loading="lazy"></a><figcaption><a href="F0_standardized_vs_normal.png" download>下载 PNG</a></figcaption></figure></main></body></html>
